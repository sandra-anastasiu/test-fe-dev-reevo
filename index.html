<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Games Client Development Test</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="assets/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="assets/favicon-16x16.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="main-container">
            <div class="brand-logo">
                <img src="assets/logo-reevo.png" alt="Reevo logo" />
            </div>
            <div class="stats">
                <div
                    class="number-of-current-shapes"
                    id="js-number-of-current-shapes"
                >
                    Number of current Shapes: 0
                </div>
                <div class="total-area" id="js-total-area">
                    Surface Area occupied by shapes: 0
                </div>
            </div>
            <div class="pixi-container" id="js-pixi-container"></div>
            <div class="controls">
                <div class="shapes-per-second">
                    <div class="buttons-container">
                        <button disabled id="js-shapes-decrease">-</button>
                        <button disabled id="js-shapes-increase">+</button>
                    </div>
                    <p class="description">Number of shapes per second</p>
                </div>
                <div class="gravity-value">
                    <div class="buttons-container">
                        <button id="js-gravity-decrease">-</button>
                        <button id="js-gravity-increase">+</button>
                    </div>
                    <p class="description">Gravity value</p>
                </div>
            </div>
        </div>

        <script type="module" src="index.js"></script>
    </body>
</html>
